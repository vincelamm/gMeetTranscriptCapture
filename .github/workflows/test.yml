name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20' # node:test and node:vm are built in — no dependencies

      - name: Syntax-check the extension sources
        run: |
          set -euo pipefail
          for f in background.js content.js popup/popup.js utils/*.js; do
            node --check "$f"
            echo "ok  $f"
          done

      - name: Run tests
        run: node --test tests/*.test.js
